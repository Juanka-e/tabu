name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Ubuntu 24.04
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create release archive
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=backups \
            -czf hushle-release.tgz .

      - name: Prepare SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' '${{ secrets.PROD_SSH_PRIVATE_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p '${{ secrets.PROD_PORT }}' '${{ secrets.PROD_HOST }}' >> ~/.ssh/known_hosts

      - name: Upload release archive
        run: |
          scp -P '${{ secrets.PROD_PORT }}' hushle-release.tgz '${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:${{ secrets.PROD_DEPLOY_PATH }}/hushle-release.tgz'

      - name: Deploy on server
        run: |
          ssh -p '${{ secrets.PROD_PORT }}' '${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}' <<'EOF'
          set -euo pipefail
          cd '${{ secrets.PROD_DEPLOY_PATH }}'
          tar -xzf hushle-release.tgz
          rm -f hushle-release.tgz
          chmod +x scripts/ops/deploy.sh scripts/ops/mysql-backup.sh scripts/ops/mysql-restore.sh
          ./scripts/ops/deploy.sh
          EOF
